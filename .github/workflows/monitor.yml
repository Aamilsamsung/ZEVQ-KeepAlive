name: Monitor Render services
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monitoring
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Validate checker unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate API authorization and input security
        run: node --test tests/keepalive-api.test.js
      - name: Run keep-alive only when enabled
        run: python3 scripts/check.py
      - name: Commit snapshot with branch-race recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zevq-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp status.json /tmp/zevq-status.json
          for attempt in $(seq 1 10); do
            git fetch origin main
            git checkout -B main origin/main
            cp /tmp/zevq-status.json status.json
            git add status.json
            if git diff --cached --quiet; then
              echo "Snapshot already current"
              exit 0
            fi
            git commit -m "chore: update service status [skip ci]"
            if git push origin HEAD:main; then
              echo "Snapshot saved"
              exit 0
            fi
            echo "Concurrent branch update; retrying $attempt/10"
            sleep $((attempt * 2))
          done
          echo "Unable to push snapshot after 10 attempts" >&2
          exit 1
