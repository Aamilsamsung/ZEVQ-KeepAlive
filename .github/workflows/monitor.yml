name: Monitor Render services
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monitoring
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Validate checker unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Run health checks and update public status snapshot
        run: python3 scripts/check.py
      - name: Commit snapshot
        run: |
          git config user.name "zevq-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update service status [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
