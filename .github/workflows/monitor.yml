name: Check Render services
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check configured public Render URLs
        env:
          MONITOR_URLS: ${{ secrets.MONITOR_URLS }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, time
          urls=json.loads(os.environ.get('MONITOR_URLS') or '[]')
          if not isinstance(urls,list): raise SystemExit('MONITOR_URLS must be a JSON array')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect())
          for url in urls[:30]:
              p=urllib.parse.urlsplit(url)
              if p.scheme!='https' or not p.hostname or not p.hostname.endswith('.onrender.com') or p.username or p.password or p.port not in (None,443):
                  print('Skipped invalid URL'); continue
              try:
                  start=time.monotonic()
                  with opener.open(urllib.request.Request(url,headers={'User-Agent':'ZEVQ-KeepAlive/1.0'}),timeout=20) as response:
                      print(p.hostname,response.status,round((time.monotonic()-start)*1000),'ms')
              except Exception as error:
                  print(p.hostname,'FAILED',str(error)[:120])
          PY